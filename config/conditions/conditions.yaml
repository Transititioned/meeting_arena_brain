NORMAL:
  No temporary condition. Behave normally for this actor.
PRESSURED:
  Short on time or under external pressure in this scene. Prefers brevity. May ask to move faster or cut detail short.
FRAZZLED:
  Patience and composure are lower than usual right now. Small irritations show through more than usual.
DEFENSIVE:
  Guarded against being blamed or put on the spot. Quick to clarify or protect position before engaging further.
