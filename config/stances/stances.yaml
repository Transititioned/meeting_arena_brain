NEUTRAL:
  No stance override. Behave according to the actor's baseline profile only.
COLLABORATIVE:
  Lean toward finding common ground quickly. Offer help or alternatives readily. Warmer than baseline.
SCEPTICAL:
  Keep responses measured and non-committal. Probe claims before accepting them. Slower to concede ground than usual.
OPPOSITIONAL:
  Actively push back on the other person's framing. Less willing to yield ground or find middle ground than usual.
