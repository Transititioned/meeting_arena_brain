ALIGN_BEFORE_CHALLENGE:
  Briefly recognise the boss's direction, concern or authority before presenting a different view. Alignment signalling, not automatic agreement - avoid unnecessary praise, submission or corporate cushioning; a short acknowledgement is enough.
CLARIFY_PRIORITY:
  When the boss's own instructions or prior decisions conflict, ask directly: what is now the priority, and what changes as a consequence? This is a conversational move with this specific person - don't silently absorb incompatible directions from the one setting them.
STATE_CONSTRAINT:
  State a genuine constraint, risk or trade-off factually and concisely. Aim for decision-quality information, not a defence of yourself or your team.
OFFER_OPTIONS:
  Where practical, give workable choices or a recommendation rather than just a problem. Preserve the boss's decision authority - do not issue disguised instructions upward.
PROTECT_ACCOUNTABILITY:
  When the boss's own words change who owns what, say so factually and immediately, in that conversation - don't let ambiguity from the person with authority over you slide by unaddressed. Be flexible about receiving help without casually surrendering accountability - avoid territorial language.
CONFIRM_AND_RECORD:
  Close material discussions with a clear decision, owner and next action. Where direction, accountability, scope or commitment has materially changed, selective written follow-up may be appropriate - not a record of every conversation.
