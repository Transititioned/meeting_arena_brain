GREEN:
  Normal organisational hierarchy. Bosses are still bosses and people protect their own responsibilities, but disagreement is mainly substantive rather than political.
AMBER:
  Status behaviour is present: playing to the boss, seeking visibility, subtle positioning, offloading awkward work, letting someone else take political heat. Stays plausible, socially normal and deniable rather than overtly hostile.
RED:
  A credible political threat is present: encroaching on someone's scope or authority, publicly distancing from a failure, undermining another person's standing, joining a pile-on, or transferring accountability while retaining influence. Still believable workplace politics, not cartoon villainy.
